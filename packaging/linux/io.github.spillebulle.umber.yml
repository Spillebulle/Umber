# Flatpak manifest.
#
# Built from the release binary rather than from source. A Flathub submission
# would have to build from source — that is their rule, and a reasonable one —
# so this manifest is for the bundle attached to a GitHub release, not for
# Flathub. Getting onto Flathub is a separate submission and is worth doing;
# this is not a substitute for it and should not be described as one.
#
# The tarball is staged as `umber-linux.tar.gz` by the workflow so that nothing
# here has to know the version. See `.github/workflows/release.yml`.

app-id: io.github.spillebulle.umber
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: umber

finish-args:
  # The GPU. Without it wgpu finds no adapter and the canvas cannot start —
  # which is the whole application.
  - --device=dri
  # Both display protocols: Wayland where there is one, X11 where there is not.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Opening and saving pictures. `home` rather than `host`: a painting
  # application has no business reading /etc, and the portal covers the rest.
  - --filesystem=home
  - --filesystem=xdg-pictures

# Deliberately **no `--share=network`**, and Umber knows it:
# `update::Updates::check_unavailable` switches the update check off inside a
# Flatpak rather than letting it time out and report a failure that is really a
# decision. Flatpak already keeps this bundle current — `flatpak update`, or any
# software centre — so opening the sandbox would buy a duplicate of something
# that already works, at the price of giving a painting application the network.
# If some later feature genuinely needs it, this is the line to change and the
# About dialog's wording is the other half of the change.

modules:
  - name: umber
    buildsystem: simple
    sources:
      - type: archive
        path: umber-linux.tar.gz
        strip-components: 1
    build-commands:
      - install -Dm755 umber /app/bin/umber

      # Everything is already named for the application ID in `packaging/`, so
      # these are plain copies. They were renames here once, with the desktop
      # file's Icon key rewritten in passing, and the AppStream `launchable`
      # was left pointing at the old name — which `appstreamcli compose`
      # follows to find the icon, so it reported `gui-app-without-icon` and
      # threw the component away. One name everywhere is what fixed it.
      - install -Dm644 packaging/io.github.spillebulle.umber.desktop
        /app/share/applications/io.github.spillebulle.umber.desktop
      - install -Dm644 packaging/io.github.spillebulle.umber.metainfo.xml
        /app/share/metainfo/io.github.spillebulle.umber.metainfo.xml

      # The `.clip` type. Flatpak exports `share/mime/packages` from the app
      # to the host and rebuilds both caches itself, so there is no scriptlet
      # here either — but the file has to be installed under the app id, which
      # is what the export is keyed on.
      - install -Dm644 packaging/io.github.spillebulle.umber.mime.xml
        /app/share/mime/packages/io.github.spillebulle.umber.xml
      - for s in 16 32 48 64 128 256; do
        install -Dm644 "icons/umber-$s.png"
        "/app/share/icons/hicolor/${s}x${s}/apps/io.github.spillebulle.umber.png";
        done

      - install -Dm644 LICENSE /app/share/licenses/umber/LICENSE
