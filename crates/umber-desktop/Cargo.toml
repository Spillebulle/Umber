[package]
name = "umber-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "umber"
path = "src/main.rs"

[dependencies]
umber-app = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }

# Compiles the icon (and a version block taken from this manifest) into the
# executable, so Explorer and the taskbar have one before the process starts.
# Cargo selects `[target.…build-dependencies]` on the *host* triple, which is
# what is wanted: the resource compiler is a host tool, and Linux and macOS
# builds never see this crate at all. See `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `AttachConsole`, so a release build started from a terminal can still be asked
# what it is doing. The binary declares the `windows` subsystem so that Explorer
# and the installer do not get a console window, and that also costs it the one
# it was launched from. See `main.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
