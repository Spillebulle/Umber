[package]
name = "umber-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is what Android's JNI loader and the iOS static link both consume;
# rlib keeps the desktop binary linking normally.
crate-type = ["lib", "cdylib"]

[dependencies]
umber-core = { workspace = true }
umber-render = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
png = "0.18.1"
rfd = "0.17.2"
directories = "6"

# The splash paints the window before wgpu exists, which is the only way to
# cover the driver's device-creation stall. All three of these are already in
# the tree underneath egui, so none of them is a new build.
#
# softbuffer draws to a winit window with no GPU at all. skrifa reads glyph
# outlines *with variation axes applied*, which ab_glyph — what egui rasterises
# with — does not do; that is what lets the splash ask Archivo for the weight
# 900 the design specifies and actually get it. ab_glyph_rasterizer turns those
# outlines into coverage. See `cputext.rs`.
softbuffer = "0.4"
skrifa = "0.42"
ab_glyph_rasterizer = "0.1"

# The update check (`update/`). Desktop only: it asks GitHub what the newest
# release is, and — where the installation is not a package manager's — fetches
# one of its assets and swaps the binary.
#
# `ureq` with **rustls and no default features**. rustls rather than native-tls
# because native-tls is OpenSSL on Linux, and an OpenSSL C build would have to
# be satisfied on both aarch64 cross-builds and inside the Flatpak sandbox —
# where there is no system OpenSSL to link against. Roots come from
# `webpki-roots`, compiled in, for the same reason: the AppImage and the Flatpak
# cannot rely on the host's certificate store being where they expect it.
# `default-features = false` drops `gzip`, which only matters for a response
# body measured in kilobytes and would otherwise put a second copy of the
# decompressor in the binary.
#
# `serde`/`serde_json` read the release JSON. Both are already in the tree under
# `umber-core`, so neither is a new build. `zip`, `tar` and `flate2` open the
# release archive far enough to lift one file out of it — the same `zip` the
# document format uses, with its codec list already cut down.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
tar = "0.4"
flate2 = "1"

# Local time. `umber-core` stores UTC and knows how to spell a moment out
# given an offset; finding that offset is the platform's job, and both of these
# are already in the tree underneath winit and wgpu, so neither is a new build.
# See `src/localtime.rs` for why this is not a date crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `Win32_System_Time` is the local-time offset above; `Win32_UI_Input_Keyboard\
# AndMouse` is what a shortcut label is named from — `MapVirtualKeyW` answers
# what the user's own layout prints on a physical key, which is the only way to
# label a binding with a key their keyboard actually has. See `src/keylayout.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    # `OpenProcess`/`WaitForSingleObject`/`GetExitCodeProcess`, which is how the
    # update helper waits for Umber to close and then for `msiexec` to finish.
    # See `src/update/installer.rs`.
    "Win32_System_Threading",
    # `SHELLEXECUTEINFOW` is gated behind this in windows-sys 0.61 even though
    # nothing here touches the registry.
    "Win32_System_Registry",
    # `SetCurrentProcessExplicitAppUserModelID`, which is what gives the taskbar
    # button an identity of its own. See `taskbar::claim_identity`.
    "Win32_UI_Shell",
    # `SetCursor`, which is the only way to take the arrow off the screen for a
    # pen: winit's own `set_cursor_visible` is gated on a flag that legacy mouse
    # messages alone ever set. See `src/syscursor.rs`.
    "Win32_UI_WindowsAndMessaging",
    # `GetDC`/`GetPixel`/`ReleaseDC`, which is how the eyedropper reads a pixel
    # that is not Umber's own. See `src/syspick.rs`. No new system library: GDI
    # is in every Windows process already.
    "Win32_Graphics_Gdi",
] }

# The desktop's clipboard (`sysclip.rs`), for pictures. Text goes out through
# egui-winit's own `clipboard` feature, which brings this same crate — arboard
# keeps one process-global X11 connection behind a `static`, so the two handles
# are one owner rather than two things to fight over a selection.
#
# Gated on Android **and iOS**, which is what egui-winit's own *code* gates on
# even though its manifest names only Android — and the code is right. arboard's
# X11/Wayland module is `all(unix, not(any(macos, android, emscripten)))`, so
# iOS falls into it and an iOS build would compile a clipboard that goes looking
# for an X server. `sysclip`'s `Board` excludes both for that reason; the
# manifest has to agree, or the dependency is still built there. `image-data` is
# what makes it
# carry pictures rather than only text, and `wayland-data-control` is the
# Wayland backend — without it a Wayland session would reach the clipboard only
# through whatever XWayland happens to be bridging, which is a session Umber
# does not get to require. Neither adds a *system*
# library: arboard's X11 path is `x11rb` speaking the protocol over the socket,
# and `wl-clipboard-rs` reaches `libwayland-client.so.0`, which winit already
# opens and every Linux package here already declares.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.15"
