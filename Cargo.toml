[workspace]
resolver = "3"
members = [
    "crates/umber-core",
    "crates/umber-render",
    "crates/umber-app",
    "crates/umber-desktop",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/Spillebulle/umber"
authors = ["Umber contributors"]

[workspace.dependencies]
umber-core = { path = "crates/umber-core" }
umber-render = { path = "crates/umber-render" }
umber-app = { path = "crates/umber-app" }

wgpu = "29"
winit = "0.30.13"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = { version = "0.35", default-features = false }

glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"
env_logger = "0.11"

# Document import (umber-core::docimport). All four are pure Rust with no C
# build step, which keeps `cargo test -p umber-core` the instant feedback loop
# it is meant to be — and keeps a mobile cross-build plausible.
#
# `zip` carries a compressor and a dozen codecs by default; ORA and KRA only
# ever use Store and Deflate, so everything else is switched off. `deflate-flate2`
# rather than the `deflate` meta-feature: the latter also pulls in zopfli, a
# *compressor* we would never call.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
png = "0.18"
# Flat image export (umber-core::export), and *only* the four formats the
# export dialog offers on top of PNG. `default-features = false` matters here:
# the default set drags in AVIF, EXR, HDR, DDS and half a dozen more decoders
# Umber never calls, and `rayon` with them.
#
# PNG is not in the list on purpose — it stays on the `png` crate above, which
# is what lets an exported PNG carry the `sRGB` chunk saying what the composite
# shader already did. See `export`'s module docs.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "tiff",
    "gif",
    "bmp",
] }
quick-xml = "0.41"
psd = "0.3.5"
# Brush library data. These are plain-data crates with no GPU or windowing
# reach, so `umber-core` can depend on them without breaking the layering:
# RON is the on-disk brush library, serde_json reads MyPaint `.myb` files, and
# `directories` only knows where a platform keeps user data.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
directories = "6"

# Debug builds keep our own crates cheap to recompile, but dependencies
# (wgpu, naga, egui) are built optimised — an unoptimised wgpu makes the
# canvas unusable to test against.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
