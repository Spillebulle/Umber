[workspace]
resolver = "3"
members = [
    "crates/umber-core",
    "crates/umber-render",
    "crates/umber-app",
    "crates/umber-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/Spillebulle/umber"
authors = ["Umber contributors"]

[workspace.dependencies]
umber-core = { path = "crates/umber-core" }
umber-render = { path = "crates/umber-render" }
umber-app = { path = "crates/umber-app" }

wgpu = "29"
winit = "0.30.13"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = { version = "0.35", default-features = false }

glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"
env_logger = "0.11"

# Debug builds keep our own crates cheap to recompile, but dependencies
# (wgpu, naga, egui) are built optimised — an unoptimised wgpu makes the
# canvas unusable to test against.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
