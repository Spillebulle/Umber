[workspace]
resolver = "3"
members = [
    "crates/umber-core",
    "crates/umber-render",
    "crates/umber-app",
    "crates/umber-desktop",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/Spillebulle/umber"
authors = ["Umber contributors"]

[workspace.dependencies]
umber-core = { path = "crates/umber-core" }
umber-render = { path = "crates/umber-render" }
umber-app = { path = "crates/umber-app" }

wgpu = "29"
winit = "0.30.13"
egui = "0.35"
egui-wgpu = "0.35"
# `default-features = false` drops `links` — `about::link_row` paints its own
# hyperlink rather than depending on `webbrowser` — and lets winit's own feature
# set come from the workspace entry above rather than being restated here.
#
# `clipboard` is on, and it is the one default kept. It is what carries Ctrl+C,
# Ctrl+X and Ctrl+V in every real `TextEdit` in the interface — the brush
# search, the rename fields, the settings pages — out to the rest of the
# machine and back. Without it egui-winit falls back to a `String` held in the
# process: text copied in Umber pastes back into Umber and nowhere else, and
# text copied anywhere else never arrives. That is the control that lies.
#
# It brings `arboard` (and `smithay-clipboard` on Linux, for Wayland text).
# `sysclip.rs` uses arboard directly for pictures; see there for why two handles
# on the clipboard in one process is safe rather than lucky.
egui-winit = { version = "0.35", default-features = false, features = [
    "clipboard",
] }

glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }

# Text. All three are already in the tree — `skrifa` and `ab_glyph_rasterizer`
# as direct dependencies of `umber-app` (the splash's `cputext.rs`), `harfrust`
# under `epaint` — and all three are plain data with no GPU, windowing or
# platform reach, so `umber-core::text` can hold the layout without touching the
# crate boundary.
#
# **The versions are pinned to what `epaint` already asks for**, and that is the
# whole reason this set was chosen over `cosmic-text`. cosmic-text 0.19 wants
# `skrifa ^0.40` and `harfrust ^0.5` where epaint 0.35 wants `^0.42.1` and
# `^0.7.0`; 0.x caret ranges do not unify, so both would be *built twice* — two
# extra compilations of a font parser and a shaper, for no behaviour. At these
# versions there is one `read-fonts` underneath all of it and nothing new is
# compiled at all. What cosmic-text would have added on top of shaping is bidi
# reordering, Unicode line breaking and font fallback; `text.rs` says out loud
# which of those Umber therefore does not do.
skrifa = "0.42"
harfrust = "0.7"
ab_glyph_rasterizer = "0.1"
pollster = "1"
log = "0.4"
env_logger = "0.11"

# Document import (umber-core::docimport). All four are pure Rust with no C
# build step, which keeps `cargo test -p umber-core` the instant feedback loop
# it is meant to be — and keeps a mobile cross-build plausible.
#
# `zip` carries a compressor and a dozen codecs by default; ORA and KRA only
# ever use Store and Deflate, so everything else is switched off. `deflate-flate2`
# rather than the `deflate` meta-feature: the latter also pulls in zopfli, a
# *compressor* we would never call.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
png = "0.18"
# Clip Studio's material pixels are plain zlib streams, one per 256x256 block,
# inside a headerless SQLite database inside a C2F chunk stream — see
# `brushimport::clipstudio`. `default-features = false` plus `rust_backend` is
# `miniz_oxide` and no C toolchain, which is the rule `sqlite.rs` and `ureq`
# already state; and it is the same crate `zip` and `png` already build, so a
# direct dependency here adds nothing to the tree.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Flat image export (umber-core::export), and *only* the four formats the
# export dialog offers on top of PNG. `default-features = false` matters here:
# the default set drags in AVIF, EXR, HDR, DDS and half a dozen more decoders
# Umber never calls, and `rayon` with them.
#
# PNG is not in the list on purpose — it stays on the `png` crate above, which
# is what lets an exported PNG carry the `sRGB` chunk saying what the composite
# shader already did. See `export`'s module docs.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "tiff",
    "gif",
    "bmp",
] }
quick-xml = "0.41"
psd = "0.3.5"
# Brush library data. These are plain-data crates with no GPU or windowing
# reach, so `umber-core` can depend on them without breaking the layering:
# RON is the on-disk brush library, serde_json reads MyPaint `.myb` files, and
# `directories` only knows where a platform keeps user data.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
directories = "6"

# Debug builds keep our own crates cheap to recompile, but dependencies
# (wgpu, naga, egui) are built optimised — an unoptimised wgpu makes the
# canvas unusable to test against.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
